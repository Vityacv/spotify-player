name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: spotify-player-linux-x86_64.tar.gz
          - os: macos-13
            artifact_name: spotify-player-macos-x86_64.tar.gz
          - os: windows-latest
            artifact_name: spotify-player-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libasound2-dev libdbus-1-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build (release)
        run: cargo build --release --features image

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/release/spotify_player"
          strip "$BIN" || true
          tar -czf "${{ matrix.artifact_name }}" -C target/release spotify_player

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Bin = "target\release\spotify_player.exe"
          $Out = "${{ matrix.artifact_name }}"
          Copy-Item $Bin "spotify_player.exe"
          Compress-Archive -Path "spotify_player.exe" -DestinationPath $Out -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
